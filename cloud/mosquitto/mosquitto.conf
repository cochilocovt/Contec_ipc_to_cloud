# HOME LAB ONLY: plain MQTT, no passwords. Anyone on your network can publish,
# including to cmd topics. Before this leaves your home network, switch to TLS on
# 8883 with per-device certificates and topic ACLs (docs/architecture.md, Security).

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
