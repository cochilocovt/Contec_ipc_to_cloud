apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    url: timescaledb:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: factory
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
