<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BX-220 Gateway Setup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="s">
/* Layout: one 820px work column; each phase is a numbered block of tick rows, hold points flagged in amber */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#15202b; --muted:#56636f; --line:#d3dae0;
  --accent:#b85f00; --accent-bg:#fbefe0; --done:#2b7a57; --code-bg:#e6ebef;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --panel:#161e25; --ink:#e2e8ed; --muted:#93a0ab; --line:#28333d;
  --accent:#f0a540; --accent-bg:#33240f; --done:#5cc196; --code-bg:#1f2932; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --panel:#161e25; --ink:#e2e8ed; --muted:#93a0ab; --line:#28333d;
  --accent:#f0a540; --accent-bg:#33240f; --done:#5cc196; --code-bg:#1f2932; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:6px 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
.meter{display:flex;align-items:center;gap:12px;margin-top:18px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--done);transition:width .25s}
.count{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.status{font-size:13px;color:var(--muted);min-height:1.5em;margin-top:6px}
.specs{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:14px}
.specs b{color:var(--ink);font-weight:500}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline;padding:16px 18px;border-bottom:1px solid var(--line)}
.num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.ph h2{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:21px;margin:0;line-height:1.2}
.ph p{grid-column:2/4;margin:0;color:var(--muted);font-size:14px}
.ph .count{color:var(--muted)}
.ph.complete .count{color:var(--done)}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line)}
li:first-child{border-top:0}
label{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:12px 18px;cursor:pointer}
label:hover{background:color-mix(in srgb,var(--code-bg) 45%,transparent)}
input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--done);cursor:pointer}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t{min-width:0}
.tt{font-weight:600}
.d{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
li.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.when{font-family:var(--mono);font-size:11.5px;color:var(--done);margin-left:6px;font-weight:400}
.hold{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  padding:0 6px;border-radius:3px;margin-right:8px;vertical-align:2px}
code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
.foot{font-size:13px;color:var(--muted)}
@media (max-width:480px){.ph{grid-template-columns:auto 1fr}.ph .count{grid-column:2}.ph p{grid-column:1/3}label{padding:12px 14px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body style="margin:0">
<div id="root"></div>
<script type="application/json" id="state">{"done":{}}</script>
<script id="app">
(function(){
var PHASES=[
{t:"Bench kit",p:"Have these on the desk before you power anything up.",k:[
["24V DC supply","Accepts 10.8–31.2V DC. A 24V/2A industrial supply or Contec's optional AC adapter. Check polarity on the terminal block."],
["USB CFast reader","CFast is not CompactFlash. A plain CF reader will not take the card."],
["Spare industrial CFast, 32GB or larger","Holds a cloned copy you can test on, while the original card stays safe in a drawer."],
["Monitor (DVI or DisplayPort), USB keyboard and mouse, two Ethernet cables",""],
["Laptop with Python and pymodbus","Used later as a simulated PLC and for reading registers by hand."]]},
{t:"Inspect before you change anything",p:"The existing setup is your best source for how this box talks to the machine.",k:[
["Power it up on the bench","Photograph the labels, ports and any wiring first."],
["Record what runs at boot","The HMI or vendor app, its version, and anything in Startup or Task Scheduler."],
["Record how it talks to the machine","PLC IP and port, or COM port with baud, parity and stop bits. Modbus unit ID. Any tag or register list in the app's config. Screenshot every settings screen. This is your register map later."],
["Export configs and network settings","Copy the app's config files and licence info, and save `ipconfig /all`, to a USB stick."],
["Check the Windows build","Run `winver`. It should show Windows 10 IoT Enterprise 2016 LTSB (version 1607)."],
["Photograph every BIOS page","Note the BIOS version and current settings before you change them."]]},
{t:"Back up the original card",p:"Nothing gets changed until this phase is done.",k:[
["Image the CFast card","On another PC with the USB reader, use Win32 Disk Imager or Macrium Reflect to make a full image, then record its SHA-256 (`certutil -hashfile bx220-original.img SHA256`)."],
["Verify the image","Restore it to the spare CFast and boot the BX-220 from that copy. If it boots and the HMI runs, the backup is good."],
["Keep two copies on different drives","Store the checksum next to each copy."],
["!Confirm the backup before going further","Image verified and the clone boots. From here on, work on the clone and keep the original card labelled and untouched."]]},
{t:"Windows housekeeping",p:"Support for this Windows edition ended on 13 October 2026. These steps keep it as safe as it can be.",k:[
["Install every update up to the final one","Run Windows Update until nothing is left. The last security update shipped on 13 October 2026."],
["Ask Contec about Extended Security Updates","For this edition, ESUs are sold only through the device maker. Ask Contec or their India distributor for price and availability."],
["Check the Unified Write Filter","`uwfmgr get-config`. If it is on, every change disappears at reboot. Turn it off for setup with `uwfmgr filter disable` and turn it back on in the last phase."],
["Install Contec's RAS utility","It restarts the box on a program hang, a failed boot or overheating, and keeps a fault log. Download it for the BX-220 from Contec's site and set up the app heartbeat."],
["Stop sleep and hibernation","Power plan set to never sleep, and `powercfg /h off`."],
["Decide whether the old HMI keeps running","Over Modbus TCP both can poll the PLC. Over RS-232 only one program can own the COM port, so the old HMI must go or hand over its data."],
["Lock down accounts","Rename the built-in Administrator, set strong passwords, and turn off auto-logon unless the local HMI needs it."],
["Time sync, stored as UTC","Turn on internet time in Date and Time settings. Your service writes UTC timestamps whatever the display timezone."]]},
{t:"BIOS",p:"",k:[
["Boot from CFast first","Take USB out of the boot order once setup is done."],
["Set power-loss behaviour to power on","So the gateway comes back by itself after a plant power cut."],
["Look for a watchdog setting","Note it, and use it alongside the RAS utility rather than as a replacement."]]},
{t:"Networking",p:"Two networks that never meet: one port faces the PLC, the other faces the internet.",k:[
["Identify and rename the two LAN ports","In `ncpa.cpl`, plug in one cable at a time and rename the adapters “PLC” and “Internet”."],
["PLC port: static IP, no gateway, no DNS","On the PLC subnet only."],
["Internet port: DHCP or static with the default gateway",""],
["No bridging and no connection sharing","Check that Internet Connection Sharing is off and the adapters are not bridged."],
["Windows Firewall","Block all inbound on every profile. Allow outbound 8883 to the broker. Turn off file and printer sharing."],
["Turn off SMBv1","`Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol` in an admin PowerShell."],
["Remote access for yourself","Tailscale or a WireGuard client, outbound only. No RDP open to the internet and no port forwarding on the plant router."]]},
{t:"Read from the PLC",p:"Read-only. Nothing in this phase writes to the machine.",k:[
["Confirm PLC make, model, protocol and register map","From your Phase 1 notes or the PLC programmer."],
["Ping the PLC from the PLC port",""],
["Read registers by hand","With QModMaster or pymodbus, using only read function codes 01–04. Compare against what the old HMI shows."],
["Write the tag map","The `read:` section of the YAML only, with scaling for each value."]]},
{t:"Cloud side",p:"",k:[
["Run an MQTT broker with TLS","EMQX or Mosquitto on a small VM, or AWS IoT Core."],
["Issue a per-device client certificate and topic ACLs","The gateway publishes only its own telemetry, state, status and cmd/ack topics, and subscribes only to its own cmd topic."],
["Create the database","TimescaleDB with a telemetry hypertable `(ts, machine_id, metric, value)` and a `commands` table."],
["Ingest service from broker to database",""],
["Grafana dashboard, read-only","Live values and trends. No controls yet."]]},
{t:"Gateway service on Windows",p:"",k:[
["Install Python 64-bit","Then a venv with pymodbus, paho-mqtt and pyyaml. Or Node-RED if you prefer flows."],
["Poll and publish","Telemetry JSON with UTC `ts` and `seq`. Retained `state` topic. Last Will on `status` for online/offline."],
["Buffer while offline","A bounded in-memory queue. If you keep a disk buffer, put it on a folder excluded from the write filter or on the second CFast slot."],
["Run it as a Windows service","Wrap it with NSSM or WinSW, start automatically, restart on failure, run under a low-privilege account."],
["Capped log files","Rotating logs with a size limit, so the CFast never fills."],
["Soak test for 48–72 hours","Check `seq` gaps, unplug the internet cable and reconnect, power-cycle the box, watch CPU and memory in Task Manager."]]},
{t:"Remote control",p:"Start only after reading has run cleanly through the soak test.",k:[
["!Agree the control design with the plant in writing","Which commands, the Local/Remote selector, interlocks in the PLC, behaviour on heartbeat loss. The hardwired E-stop is never touched. Include how you'll handle the unpatched OS: ESUs from Contec, or a date to move off it."],
["PLC programmer adds command bits and heartbeat logic","The PLC decides whether a command runs. The gateway only requests."],
["Command handler on the gateway","Allowlist from the tag map, expiry check, dedupe by `cmd_id`, acks: accepted, executed, rejected, expired."],
["Backend API and control screen","Login with 2FA, operator roles, audit log. The screen shows “requested” until telemetry confirms the change."],
["Test against a simulated PLC","pymodbus server on your laptop with the same coils and registers."],
["!Live test with the plant engineer present","Machine in a safe state. Test a normal start/stop, a reject in LOCAL mode, an expired command, and a cut network link."]]},
{t:"Harden and hand over",p:"",k:[
["Turn the write filter back on","`uwfmgr volume protect c:` and `uwfmgr filter enable`, with exclusions for your service's config, buffer and log folders. Reboot and confirm your service still starts."],
["BIOS password, USB boot off",""],
["Uninstall what you don't need","Old tools, test software, and the old HMI if it was retired."],
["Image the finished card as the golden image","So a failed card is a 15-minute swap."],
["Write a one-page runbook","IPs and ports, where secrets live, how to restore the golden image, how to roll back to the original card."],
["Mount it properly","DIN rail or panel, CFast retaining clamp fitted, cables strain-relieved."]]}
];
var KEY="bx220-setup-local";
var state;try{state=JSON.parse(document.getElementById("state").textContent)}catch(e){state={done:{}}}
if(!state.done)state.done={};
var art=null,mode="loading",timer=null;
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short"})}catch(e){return""}}
var total=0;PHASES.forEach(function(p){total+=p.k.length});
function render(){
  var done=Object.keys(state.done).length,h="";
  h+='<header><div class="eyebrow">Contec BX-220D-DC781724 · edge gateway</div><h1>BX-220 Gateway Setup</h1>';
  h+='<p class="lede">Keeps the box on its Windows 10 IoT install and turns it into a gateway that reads the machine, publishes to the cloud, and later accepts start/stop commands. Work top to bottom. Amber items are hold points.</p>';
  h+='<div class="specs"><span><b>CPU</b> Atom E3845 4-core</span><span><b>RAM</b> 4GB ECC</span><span><b>Storage</b> 2× CFast</span><span><b>Ports</b> 2× GbE, 2× RS-232C</span><span><b>Power</b> 10.8–31.2V DC</span></div>';
  h+='<div class="meter"><div class="bar"><i style="width:'+(done/total*100).toFixed(1)+'%"></i></div><span class="count">'+done+' of '+total+'</span></div>';
  h+='<div class="status" id="status" aria-live="polite"></div></header>';
  PHASES.forEach(function(p,pi){
    var n=0;p.k.forEach(function(_,ki){if(state.done[pi+"-"+ki])n++});
    var num=pi===0?"00":String(pi).padStart(2,"0");
    h+='<section><div class="ph'+(n===p.k.length?" complete":"")+'"><span class="num">'+num+'</span><h2>'+esc(p.t)+'</h2><span class="count">'+n+'/'+p.k.length+'</span>'+(p.p?'<p>'+esc(p.p)+'</p>':'')+'</div><ul>';
    p.k.forEach(function(k,ki){
      var id=pi+"-"+ki,d=state.done[id],title=k[0],hold=false;
      if(title.charAt(0)==="!"){hold=true;title=title.slice(1)}
      h+='<li class="'+(d?"done":"")+'"><label for="c'+id+'"><input type="checkbox" id="c'+id+'" data-id="'+id+'"'+(d?" checked":"")+'><span class="t"><span class="tt">'+(hold?'<span class="hold">Hold point</span>':'')+esc(title)+(d?'<span class="when">'+fmtDate(d)+'</span>':'')+'</span>'+(k[1]?'<div class="d">'+fmt(k[1])+'</div>':'')+'</span></label></li>';
    });
    h+='</ul></section>';
  });
  h+='<p class="foot">'+(mode==="shared"?"Ticks save to this page for everyone who opens it.":mode==="local"?"Ticks are saved in this browser only.":"")+'</p>';
  var root=document.getElementById("root"),y=window.scrollY,f=document.activeElement&&document.activeElement.id;
  root.innerHTML='<div class="wrap">'+h+'</div>';
  if(f){var el=document.getElementById(f);if(el)el.focus({preventScroll:true})}
  window.scrollTo(0,y);
}
function setStatus(t){var s=document.getElementById("status");if(s)s.textContent=t}
function buildDoc(){
  var c="<"+"/",sc="script>";
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var link=document.querySelector('link[rel="stylesheet"]');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'
   +'<title>BX-220 Gateway Setup'+c+'title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   +(link?link.outerHTML:"")+'\n<style id="s">'+document.getElementById("s").textContent+c+'style>\n<div id="root">'+c+'div>\n'
   +'<script type="application/json" id="state">'+json+c+sc+'\n<script id="app">'+document.getElementById("app").textContent+c+sc+'\n</body></html>';
}
function save(){
  if(mode==="local"){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}return}
  if(mode!=="shared")return;
  clearTimeout(timer);setStatus("Saving shortly…");
  timer=setTimeout(function(){
    setStatus("Saving…");
    art.publish(buildDoc()).then(function(){setStatus("Saved")}).catch(function(e){
      var code=e&&e.code;
      if(code==="conflict"){setStatus("Someone else saved at the same time. Reloading their version.")}
      else if(code==="not_granted"||code==="not_writer"){mode="local";setStatus("You can't save to this page. Ticks are kept in this browser only.");save();render()}
      else setStatus("Couldn't save. Your ticks are still on screen; tick again to retry.")
    });
  },2500);
}
document.addEventListener("change",function(e){
  var id=e.target&&e.target.getAttribute("data-id");if(!id)return;
  if(e.target.checked)state.done[id]=new Date().toISOString();else delete state.done[id];
  render();save();
});
render();
var go=function(){
  var p=window.claude&&window.claude.use?window.claude.use("artifact"):Promise.resolve(null);
  p.then(function(a){
    if(a){art=a;mode="shared"}else{
      mode="local";
      try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.done){state=s}}catch(e){}
    }
    render();
  }).catch(function(){mode="local";render()});
};
go();
})();
</script>

</body>
</html>
